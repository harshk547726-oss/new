{% extends 'base.html' %}
{% block title %}Contact{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7"><div class="card p-4">
  <h3>Contact Us</h3>
  <form method="post">
    <div class="mb-3"><input class="form-control" name="name" placeholder="Name" required></div>
    <div class="mb-3"><input class="form-control" name="email" placeholder="Email" type="email" required></div>
    <div class="mb-3"><textarea class="form-control" name="message" placeholder="Message" rows="4" required></textarea></div>
    <button class="btn btn-primary">Send Message</button>
  </form>
</div></div></div>
{% endblock %}
